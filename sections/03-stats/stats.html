<!-- ==============================================================================
     SECTION: STATS COUNTER ROW
     Folder: sections/03-stats/stats.html
     Deskripsi: Baris kartu counter statistik (Tahun Belajar, Organisasi, Proyek, Event)
     ============================================================================== -->

<div class="dev-stats-row">
    <!-- Stat 1: Tahun Belajar -->
    <div class="dev-stat-card reveal-on-scroll delay-1">
        <div class="dev-stat-number" data-count-to="1" data-suffix="±">0</div>
        <div class="dev-stat-label">Tahun Belajar</div>
    </div>

    <!-- Stat 2: Pengalaman Organisasi -->
    <div class="dev-stat-card reveal-on-scroll delay-2">
        <div class="dev-stat-number" data-count-to="4" data-suffix="">0</div>
        <div class="dev-stat-label">Pengalaman Organisasi</div>
    </div>

    <!-- Stat 3: Proyek Diselesaikan -->
    <div class="dev-stat-card reveal-on-scroll delay-3">
        <div class="dev-stat-number" data-count-to="2" data-suffix="+">0</div>
        <div class="dev-stat-label">Proyek Diselesaikan</div>
    </div>

    <!-- Stat 4: Event Diikuti -->
    <div class="dev-stat-card reveal-on-scroll delay-4">
        <div class="dev-stat-number" data-count-to="10" data-suffix="+">0</div>
        <div class="dev-stat-label">Event Diikuti</div>
    </div>
</div>
