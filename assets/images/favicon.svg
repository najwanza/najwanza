<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Main Icon Gradient (Cyan to Purple) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" filter="url(#glow)"/>

  <!-- Inner Ambient Glow Ring -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="4"/>

  <!-- Developer Code Bracket Left: < -->
  <path d="M 170 175 L 95 256 L 170 337" fill="none" stroke="url(#brandGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Developer Code Bracket Right: > -->
  <path d="M 342 175 L 417 256 L 342 337" fill="none" stroke="url(#brandGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stylized Monogram 'Z' (Zakyy / Najwan Zaki) in Center -->
  <path d="M 215 200 L 297 200 L 215 312 L 297 312" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Live Pulse Dot in Top Right -->
  <circle cx="370" cy="142" r="18" fill="url(#accentGrad)"/>
  <circle cx="370" cy="142" r="28" fill="none" stroke="#7ee787" stroke-width="4" opacity="0.5"/>
</svg>
